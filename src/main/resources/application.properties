spring.application.name=Ollama Mock
server.port=11434

ollama.mock.version=${OLLAMA_MOCK_VERSION:@project.version@}
ollama.mock.default-model=${OLLAMA_MOCK_MODEL:qwen3.5:2b}
# Models served besides the default (comma-separated). The frontend's default model and the
# Docker Model Runner names stay accepted, so the UI works against the mock out of the box.
ollama.mock.models=${OLLAMA_MOCK_MODELS:hf.co/prism-ml/Bonsai-27B-gguf:Q1_0,hf.co/unsloth/Qwen3.5-2B-GGUF:Q4_K_M}
ollama.mock.token-delay=${OLLAMA_MOCK_TOKEN_DELAY:50ms}
ollama.mock.tool-call-delay=${OLLAMA_MOCK_TOOL_DELAY:1s}
